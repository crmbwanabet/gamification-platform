    <rect x="111" y="130" width="20" height="11" fill="#CFEAF8"/>
    <rect x="163" y="130" width="18" height="11" fill="#CFEAF8"/>
    <rect x="101" y="119" width="90" height="6" rx="1.5" fill="#E6E0D2"/>
    <rect x="108" y="96" width="84" height="23" fill="#E8C547"/>
    <rect x="114" y="101" width="22" height="12" fill="#FFE7A6"/>
    <rect x="164" y="101" width="22" height="12" fill="#FFE7A6"/>
    <rect x="142" y="102" width="14" height="8" fill="#F2F2F2"/>
    <rect x="105" y="91" width="90" height="6" rx="1.5" fill="#E6E0D2"/>
