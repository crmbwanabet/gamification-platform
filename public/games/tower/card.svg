  <rect x="2" y="86" width="22" height="70" fill="url(#lit)" stroke="#2A0A4F" stroke-width="2"/>
  <rect x="58" y="80" width="28" height="76" fill="url(#lit)" stroke="#2A0A4F" stroke-width="2"/>
  <rect x="200" y="74" width="26" height="82" fill="url(#boz)" stroke="#2A0A4F" stroke-width="2"/>
