    <path d="M157 22V38M163 22V38" stroke="#000" stroke-width="1.8"/>
    <rect x="152" y="37" width="16" height="11" rx="3" fill="#FFD21F" stroke="#2A0A4F" stroke-width="2"/>
    <path d="M160 48V52Q155 52 155.5 56Q157 59 160 58.5" stroke="#2A0A4F" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M160 55L124 62M160 55L196 62" stroke="rgba(255,255,255,.6)" stroke-width="3.4"/>
    <path d="M160 55L124 62M160 55L196 62" stroke="#000" stroke-width="1.8"/>
    <path d="M114 84L160 61L206 84Z" fill="#2A0A4F"/>
    <path d="M119 82L160 64L201 82Z" fill="#D8423A"/>
