  <rect x="38" y="23" width="18" height="13" rx="2.5" fill="#F4F1E8" stroke="#2A0A4F" stroke-width="2"/>
  <rect x="41" y="25.5" width="12" height="6.5" rx="1.5" fill="#7FC3EA" stroke="#2A0A4F" stroke-width="1.3"/>
  <rect x="151" y="20" width="18" height="6" rx="1.5" fill="#3A3A44" stroke="#2A0A4F" stroke-width="1.8"/>
