  <use href="#st" transform="translate(222 14) scale(1.1)" fill="#FFF3B0"/>
  <use href="#st" transform="translate(306 64) scale(.8)" fill="#FFF3B0"/>
  <use href="#st" transform="translate(80 50) scale(.7)" fill="#FFF3B0"/>
