  <g transform="translate(268 30) rotate(8)">
    <rect x="-40" y="-20" width="80" height="40" rx="14" fill="url(#badge)" stroke="#2A0A4F" stroke-width="3"/>
    <path d="M-32 -12 Q-26 -16 -16 -15" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".8"/>
    <text x="0" y="11" text-anchor="middle" font-family="Lilita One, Arial Black, sans-serif" font-size="28" fill="#fff" stroke="#2A0A4F" stroke-width="5" stroke-linejoin="round" paint-order="stroke">12<tspan font-size="19">×</tspan></text>
