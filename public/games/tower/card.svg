<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B0F5E"/><stop offset=".55" stop-color="#5B2BB0"/><stop offset=".85" stop-color="#C8607A"/><stop offset="1" stop-color="#FF9A5A"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8A4BE0" stop-opacity=".85"/><stop offset="1" stop-color="#5B2BB0" stop-opacity="0"/></radialGradient>
    <linearGradient id="boz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6FC2C8"/><stop offset=".55" stop-color="#3E8E9C"/><stop offset="1" stop-color="#2A6474"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset=".5" stop-color="#FFC21F"/><stop offset="1" stop-color="#E08A00"/></linearGradient>
    <pattern id="lit" width="9" height="11" patternUnits="userSpaceOnUse"><rect width="9" height="11" fill="#7A6AAE"/><rect x="1.5" y="1.5" width="2.5" height="3.5" fill="#FFCF7A"/><rect x="5.5" y="1.5" width="2.5" height="3.5" fill="#3A2A5E"/><rect x="1.5" y="7" width="2.5" height="3.5" fill="#3A2A5E"/><rect x="5.5" y="7" width="2.5" height="3.5" fill="#FFE3A0"/></pattern>
    <pattern id="fins" width="4" height="6" patternUnits="userSpaceOnUse"><rect width="4" height="6" fill="#B9B0D6"/><rect width="1.6" height="6" fill="#F0ECF8"/></pattern>
    <pattern id="mast" x="22" y="34" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0L14 14M0 14L14 0M0 0H14" stroke="#2A0A4F" stroke-width="3.4" fill="none"/><path d="M0 0L14 14M0 14L14 0" stroke="#FFD21F" stroke-width="1.5" fill="none"/></pattern>
    <pattern id="jib" x="0" y="14" width="12" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L6 0L12 8" stroke="#2A0A4F" stroke-width="3" fill="none"/><path d="M0 8L6 0L12 8" stroke="#FFD21F" stroke-width="1.4" fill="none"/></pattern>
    <path id="st" d="M0 -5 Q.9 -.9 5 0 Q.9 .9 0 5 Q-.9 .9 -5 0 Q-.9 -.9 0 -5Z"/>
  </defs>
  <rect width="320" height="164" fill="url(#sky)"/>
  <circle cx="160" cy="110" r="95" fill="url(#glow)"/>
