<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bonus Center Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Bonus Center OPS CONSOLE (2026-10-22). Same look as the USSD ops console:
   white back-office report screen, one row of tabs, a filter bar over sortable
   tables with a pinned TOTALS row, hand-drawn SVG charts. Light only. */
:root {
  color-scheme: light;
  --text: #4a4a4a; --sub: #6b6b6b; --muted: #9a9a9a;
  --line: #dadada; --line2: #ececec; --zebra: #f4f4f4; --totals: #dedbf3; --hover: #e3eefb;
  --link: #3b8ed8; --btn: #2b8fdd; --btn-h: #1f7ccc; --teal: #1a9f8f; --neg: #c0392b; --pos: #1e8449; --warn: #b9770e;
  --font: "Roboto", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #fff; color: var(--text); font: 14px/1.45 var(--font); }
body { padding-right: 10px; }
body::after { content: ""; position: fixed; top: 0; right: 0; bottom: 0; width: 10px; background: linear-gradient(180deg, var(--teal), #16867a); }
a { color: var(--link); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
.top { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 12px 22px 0; border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .01em; white-space: nowrap; padding-bottom: 10px; }
.brand b { color: var(--teal); font-weight: 700; }
.brand small { font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-left: 6px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.tab { all: unset; cursor: pointer; padding: 8px 12px 10px; font-weight: 500; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); border-bottom: 3px solid transparent; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--teal); }
.tab:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--line2); color: var(--sub); font-size: 11px; text-align: center; }
.acct { all: unset; cursor: pointer; padding: 4px 10px 12px; font-size: 20px; color: var(--sub); }
.menu { position: absolute; right: 22px; top: 48px; background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12); min-width: 220px; z-index: 20; }
.menu .who { padding: 10px 14px; border-bottom: 1px solid var(--line2); font-size: 12.5px; color: var(--sub); }
.menu .who b { color: var(--text); display: block; font-size: 14px; }
.menu button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 9px 14px; cursor: pointer; }
.menu button:hover { background: var(--hover); }
main { padding: 14px 22px 40px; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 18px; padding: 6px 0 14px; border-bottom: 1px solid var(--line2); margin-bottom: 14px; }
.f { display: grid; gap: 2px; }
.f label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select { font: inherit; color: var(--text); border: 0; border-bottom: 1px solid var(--line); padding: 4px 2px; background: transparent; min-width: 0; }
input[type="text"], input[type="password"] { min-width: 170px; }
.btn { all: unset; cursor: pointer; background: var(--btn); color: #fff; font-weight: 500; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 14px; border-radius: 2px; text-align: center; }
.btn:hover { background: var(--btn-h); }
.btn.ghost { background: transparent; color: var(--btn); border: 1px solid var(--btn); padding: 7px 13px; }
.btn.ghost:hover { background: var(--hover); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.live { margin-left: auto; font-size: 12.5px; color: var(--muted); align-self: center; }
.live b { color: var(--pos); }
h2.sec { font-size: 15px; font-weight: 700; margin: 22px 0 8px; }
h2.sec:first-child { margin-top: 4px; }
.note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }
.wrap { overflow-x: auto; border: 1px solid var(--line2); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line2); }
th { font-size: 11.5px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--sub); background: #fff; position: sticky; top: 0; cursor: default; user-select: none; }
th.sort { cursor: pointer; }
th.sort:hover { color: var(--text); }
th .ar { color: var(--teal); }
td.n, th.n { text-align: right; }
tbody tr:nth-child(even) { background: var(--zebra); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--hover); }
tr.totals td { background: var(--totals); font-weight: 700; }
.neg { color: var(--neg); } .pos { color: var(--pos); } .mut { color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 500; }
.pill.ok { background: #d5f0df; color: var(--pos); } .pill.bad { background: #f7d8d5; color: var(--neg); }
.pill.warn { background: #fbecd0; color: var(--warn); } .pill.grey { background: var(--line2); color: var(--sub); }
.pager { display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding: 8px 0; color: var(--sub); font-size: 12.5px; }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }
.banner { padding: 12px 14px; margin-bottom: 12px; border-left: 4px solid var(--pos); background: #eef8f2; }
.banner.bad { border-color: var(--neg); background: #fbeeec; } .banner.warn { border-color: var(--warn); background: #fdf5e6; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 18px; margin: 6px 0 4px; }
.kv div { border-bottom: 1px solid var(--line2); padding: 4px 0; }
.kv small { display: block; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kv b { font-weight: 500; font-size: 15px; }
.chart { border: 1px solid var(--line2); padding: 10px 12px 6px; margin-bottom: 16px; }
.chart h3 { margin: 0 0 2px; font-size: 13.5px; font-weight: 700; }
.chart .cap { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 0 16px; }
dialog { border: 1px solid var(--line); padding: 0; max-width: min(980px, 96vw); width: 100%; box-shadow: 0 16px 50px rgba(0,0,0,.25); color: var(--text); }
dialog::backdrop { background: rgba(30, 30, 40, .35); }
.dh { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line2); position: sticky; top: 0; background: #fff; z-index: 1; }
.dh h2 { margin: 0; font-size: 17px; } .dh p { margin: 2px 0 0; color: var(--sub); font-size: 12.5px; }
.dh .x { all: unset; cursor: pointer; margin-left: auto; font-size: 20px; color: var(--muted); padding: 0 4px; }
.db { padding: 6px 18px 18px; max-height: 76vh; overflow: auto; }
dialog.small { max-width: 420px; }
.form { display: grid; gap: 12px; padding: 10px 0; }
.form .f input, .form .f select { min-width: 0; width: 100%; }
.err { color: var(--neg); font-size: 12.5px; min-height: 18px; }
.ticks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; }
.ticks label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #333; color: #fff; padding: 9px 16px; border-radius: 3px; font-size: 13px; z-index: 50; }
.warnbox { background: #fdf5e6; border-left: 4px solid var(--warn); padding: 8px 12px; font-size: 12.5px; }
@media (max-width: 720px) { .top { padding: 10px 12px 0; } main { padding: 12px; } .charts { grid-template-columns: minmax(0, 1fr); } .live { margin-left: 0; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">BwanaBet <b>BONUS CENTER</b><small>OPS CONSOLE</small></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <button class="acct" id="acctBtn" aria-label="Account" title="Account" hidden>⋯</button>
</header>
<div class="menu" id="menu" hidden></div>
<main>
  <div class="filters" id="filters" hidden>
    <div class="f"><label for="fFrom">From</label><input type="date" id="fFrom"></div>
    <div class="f"><label for="fTo">To</label><input type="date" id="fTo"></div>
    <div class="f" data-for="report players"><label for="fBand">Level band</label>
      <select id="fBand"><option value="all">ALL</option><option value="street">Street (1–4)</option><option value="amateur">Amateur (5–7)</option><option value="pro">Pro (8–11)</option><option value="intl">International (12–19)</option></select></div>
    <div class="f" data-for="report players transactions"><label for="fQ">Player ID or name</label><input type="text" id="fQ" placeholder="e.g. 67081"></div>
    <div class="f" data-for="report"><label for="fRows">Rows</label><select id="fRows"><option value="players">Players</option><option value="days">Days</option></select></div>
    <div class="f" data-for="transactions"><label for="fStatus">Status</label><select id="fStatus"><option value="all">ALL</option><option value="pending">Pending</option><option value="credited">Credited</option><option value="rejected">Rejected</option></select></div>
    <button class="btn" id="fGo">Filter</button>
    <button class="btn ghost" id="fClear">Clear filters</button>
    <span class="live" id="liveNote"></span>
  </div>
  <section id="view"><p class="empty">Not connected.</p></section>
</main>

<dialog id="loginDlg" class="small" aria-labelledby="loginTitle">
  <div class="dh"><div><h2 id="loginTitle">Connect</h2><p>The console holds no data of its own. Figures load from the Bonus Center server.</p></div></div>
  <form class="db form" id="loginForm" autocomplete="on">
    <div class="warnbox" id="setupNote" hidden>No logins exist yet. Enter the setup code to create the first administrator (master).</div>
    <div class="f" id="setupRow" hidden><label for="lCode">Setup code</label><input type="password" id="lCode" autocomplete="off"></div>
    <div class="f"><label for="lUser">Username</label><input type="text" id="lUser" autocomplete="username" required></div>
    <div class="f"><label for="lPass">Password</label><input type="password" id="lPass" autocomplete="current-password" required></div>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn" id="lGo" type="submit">Sign in</button>
  </form>
</dialog>

<dialog id="playerDlg" aria-labelledby="pTitle">
  <div class="dh"><div><h2 id="pTitle">Player</h2><p id="pSub"></p></div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="db" id="pBody"></div>
</dialog>

<dialog id="usersDlg" aria-labelledby="uTitle">
  <div class="dh"><div><h2 id="uTitle">Logins</h2><p>Who can open this console, and what they may see.</p></div><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="db" id="uBody"></div>
</dialog>

<dialog id="formDlg" class="small" aria-labelledby="fdTitle">
  <div class="dh"><div><h2 id="fdTitle"></h2><p id="fdSub"></p></div><button class="x" data-close aria-label="Close">✕</button></div>
  <form class="db form" id="fdForm"></form>
</dialog>

<script>
(function () {
  'use strict';
  var API = '/api/ops/';
  var TABS = [
    { id: 'report', label: 'Report', perm: 'see.report' },
    { id: 'coins', label: 'Coins & prizes', perm: 'see.coins' },
    { id: 'games', label: 'Games', perm: 'see.games' },
    { id: 'transactions', label: 'Transactions', perm: 'see.txns' },
    { id: 'trends', label: 'Trends', perm: 'see.trends' },
    { id: 'players', label: 'Players', perm: 'see.players' },
    { id: 'activity', label: 'Activity', perm: 'see.activity' },
    { id: 'health', label: 'System health', perm: 'see.health' },
  ];
  var EVENT_LABEL = {
    daily_claimed: 'Daily reward', mission_completed: 'BwanaBet missions', sports_mission_claimed: 'Sports missions',
    prediction_claimed: 'Weekly predictions', leaderboard_claimed: 'League table prizes', comeback_claimed: 'Comeback bonus',
    album_set_claimed: 'Souvenir album sets', hustle_collected: 'Side quests', league_bonus_claimed: 'Football league bonuses',
    wc_bonus_claimed: 'World Cup bonuses', story_prize_claimed: 'Story prize', level_up: 'Level-up rewards', streak_bonus: 'Streak bonus (old)',
  };
  var GAME_LABEL = { njuka: 'Njuka Boss', coinflip: 'Coin Flip', penalty: 'Penalty Crash', chicken: 'Chicken Catch', chicken2: 'Chicken Catch 2', minibus: 'Lucky Minibus', bottle: 'Bottle Spin', scratch: 'Scratch Card', numbers: 'Lucky Numbers' };
  var BAND_LABEL = { street: 'Street', amateur: 'Amateur', pro: 'Pro', intl: 'International' };

  // ---------------------------------------------------------------- state --
  var S = { token: null, me: null, tab: 'report', data: {}, sort: {}, page: 0, timer: 0, menuOpen: false };
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* blocked */ } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) { /* blocked */ } },
  };

  // --------------------------------------------------------------- format --
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function int(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
  function kw(n) { var v = Number(n) || 0; var a = Math.abs(v); var s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'm' : a.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? '−K' : 'K') + s; }
  function pct(a, b) { return b ? (100 * a / b).toFixed(1) + '%' : '—'; }
  function mins(n) { return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  function lusaka(ts) { var d = new Date(new Date(ts).getTime() + 2 * 3600e3); return d.toISOString(); }
  function dt(ts) { if (!ts) return '—'; var s = lusaka(ts); return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) + ' ' + s.slice(11, 19); }
  function day(d) { if (!d) return '—'; var s = String(d).slice(0, 10); return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4); }
  function ago(ts) { if (!ts) return '—'; var m = Math.round((Date.now() - new Date(ts).getTime()) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; var h = Math.round(m / 60); if (h < 48) return h + ' h ago'; return Math.round(h / 24) + ' days ago'; }
  function todayL() { return lusaka(Date.now()).slice(0, 10); }
  function signed(n, cls) { var v = Number(n) || 0; return '<span class="' + (v < 0 ? 'neg' : v > 0 ? (cls || 'pos') : '') + '">' + (v < 0 ? '−' : '') + int(Math.abs(v)) + '</span>'; }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }

  // ------------------------------------------------------------------ api --
  function api(path, body) {
    var opts = { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, cache: 'no-store' };
    if (S.token) opts.headers['X-Admin-Session'] = S.token;
    if (body) opts.body = JSON.stringify(body);
    return fetch(API + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401 && path.indexOf('auth/') !== 0) { signOut(true); throw new Error('signed_out'); }
        if (r.status === 403) { toast('Not allowed for your login.'); throw new Error('not_allowed'); }
        if (!r.ok) { var e = new Error(d.reason || d.error || ('HTTP ' + r.status)); e.code = d.error; e.status = r.status; throw e; }
        return d;
      });
    });
  }

  // ----------------------------------------------------------------- auth --
  function openLogin() {
    $('lErr').textContent = '';
    api('auth/status').then(function (st) {
      var setup = !st.hasUsers;
      $('setupNote').hidden = !setup; $('setupRow').hidden = !setup;
      if (setup && !st.setupEnabled) { $('setupNote').textContent = 'No logins exist yet, and setup is switched off on the server (OPS_SETUP_CODE is not set).'; }
      $('lGo').textContent = setup ? 'Create administrator' : 'Sign in';
      $('loginForm').dataset.setup = setup ? '1' : '';
      $('lPass').autocomplete = setup ? 'new-password' : 'current-password';
    }).catch(function () { $('lErr').textContent = 'The server did not answer. Try again in a moment.'; });
    if (!$('loginDlg').open) $('loginDlg').showModal();
    setTimeout(function () { $('lUser').focus(); }, 50);
  }
  $('loginDlg').addEventListener('cancel', function (e) { e.preventDefault(); });
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var setup = !!$('loginForm').dataset.setup;
    var body = { username: $('lUser').value, password: $('lPass').value };
    if (setup) body.setupCode = $('lCode').value;
    $('lGo').disabled = true; $('lErr').textContent = '';
    api(setup ? 'auth/bootstrap' : 'auth/login', body).then(function (d) {
      S.token = d.token; store.set('bc-ops-auth', { token: d.token });
      $('lPass').value = ''; $('lCode').value = '';
      $('loginDlg').close();
      boot();
    }).catch(function (err) {
      var c = err.code;
      $('lErr').textContent = c === 'bad_login' ? 'Wrong username or password.' : c === 'too_many_attempts' ? 'Too many attempts. Wait 15 minutes.' : c === 'bad_setup_code' ? 'Wrong setup code.'
        : c === 'bad_username' ? 'Username: 3–32 lowercase letters, digits, . _ or -.' : c === 'weak_password' ? (err.message || 'Use at least 12 characters.') : c === 'already_set_up' ? 'An administrator already exists. Sign in instead.' : 'Could not sign in: ' + err.message;
      if (c === 'already_set_up') openLogin();
    }).finally(function () { $('lGo').disabled = false; });
  });
  function signOut(expired) {
    if (!expired && S.token) api('auth/logout', {}).catch(function () {});
    S.token = null; S.me = null; store.del('bc-ops-auth'); clearInterval(S.timer);
    $('acctBtn').hidden = true; $('filters').hidden = true; $('tabs').innerHTML = '';
    $('view').innerHTML = '<p class="empty">Not connected.</p>';
    closeMenu(); openLogin();
  }

  // ------------------------------------------------------------- account --
  function closeMenu() { $('menu').hidden = true; S.menuOpen = false; }
  $('acctBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (S.menuOpen) return closeMenu();
    var m = $('menu');
    m.innerHTML = '<div class="who"><b>' + esc(S.me.username) + '</b>' + esc(S.me.role === 'master' ? 'Master (everything)' : 'Limited') + ' · ' + esc(location.host) + '</div>' +
      (S.me.permissions.indexOf('can.users') >= 0 ? '<button data-act="users">Manage logins</button>' : '') +
      '<button data-act="pw">Change my password</button><button data-act="out">Sign out</button>';
    m.hidden = false; S.menuOpen = true;
  });
  document.addEventListener('click', function (e) { if (S.menuOpen && !$('menu').contains(e.target)) closeMenu(); });
  $('menu').addEventListener('click', function (e) {
    var a = e.target.getAttribute('data-act'); if (!a) return; closeMenu();
    if (a === 'out') signOut(false);
    if (a === 'pw') formDialog('Change my password', '', [
      { id: 'current', label: 'Current password', type: 'password', ac: 'current-password' },
      { id: 'password', label: 'New password (12+ characters)', type: 'password', ac: 'new-password' },
    ], 'Change password', function (v) { return api('auth/password', v).then(function () { toast('Password changed. Other sessions were signed out.'); }); });
    if (a === 'users') openUsers();
  });
  document.querySelectorAll('dialog [data-close]').forEach(function (b) { b.addEventListener('click', function () { b.closest('dialog').close(); }); });

  function formDialog(title, sub, fields, submitLabel, onSubmit) {
    $('fdTitle').textContent = title; $('fdSub').textContent = sub || '';
    var f = $('fdForm');
    f.innerHTML = fields.map(function (x) {
      if (x.type === 'select') return '<div class="f"><label for="fd_' + x.id + '">' + esc(x.label) + '</label><select id="fd_' + x.id + '">' + x.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === x.value ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>';
      if (x.type === 'ticks') return '<div class="f"><label>' + esc(x.label) + '</label><div class="ticks">' + x.options.map(function (o) { return '<label><input type="checkbox" name="fd_' + x.id + '" value="' + esc(o.id) + '"' + ((x.value || []).indexOf(o.id) >= 0 ? ' checked' : '') + '> ' + esc(o.label) + '</label>'; }).join('') + '</div></div>';
      return '<div class="f"><label for="fd_' + x.id + '">' + esc(x.label) + '</label><input type="' + (x.type || 'text') + '" id="fd_' + x.id + '" autocomplete="' + (x.ac || 'off') + '" spellcheck="false" data-lpignore="true" value="' + esc(x.value || '') + '"></div>';
    }).join('') + '<div class="err" id="fdErr" role="alert"></div><button class="btn" type="submit">' + esc(submitLabel) + '</button>';
    f.onsubmit = function (e) {
      e.preventDefault();
      var v = {};
      fields.forEach(function (x) {
        if (x.type === 'ticks') v[x.id] = Array.prototype.map.call(f.querySelectorAll('input[name="fd_' + x.id + '"]:checked'), function (i) { return i.value; });
        else v[x.id] = $('fd_' + x.id).value;
      });
      $('fdErr').textContent = '';
      onSubmit(v).then(function () { $('formDlg').close(); }).catch(function (err) {
        $('fdErr').textContent = err.code === 'bad_password' ? 'Current password is wrong.' : err.code === 'username_taken' ? 'That username is taken.' : err.code === 'bad_username' ? 'Username: 3–32 lowercase letters, digits, . _ or -.' : (err.message || 'Could not save.');
      });

  // -------------------------------------------------------------- filters --
  function filters() {

  }
  function qs(o) { return Object.keys(o).filter(function (k) { return o[k] != null && o[k] !== ''; }).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(o[k]); }).join('&'); }
  function saveFilters() { var f = filters(); store.set('bc-ops-filters', { band: f.band, q: f.q, rows: f.rows, status: f.status, tab: S.tab }); }
  function restoreFilters() {
    var f = store.get('bc-ops-filters') || {};
    $('fFrom').value = todayL(); $('fTo').value = todayL();
    if (f.band) $('fBand').value = f.band; if (f.q) $('fQ').value = f.q; if (f.rows) $('fRows').value = f.rows; if (f.status) $('fStatus').value = f.status;

  }

  $('fClear').onclick = function () { $('fFrom').value = todayL(); $('fTo').value = todayL(); $('fBand').value = 'all'; $('fQ').value = ''; $('fStatus').value = 'all'; S.page = 0; saveFilters(); load(); };
  ['fQ'].forEach(function (id) { $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') $('fGo').click(); }); });
  function filteredBy() {
    var f = filters(), parts = [];
    if (f.band !== 'all' && /report|players/.test(S.tab)) parts.push('level band ' + BAND_LABEL[f.band]);
    if (f.q && /report|players|transactions/.test(S.tab)) parts.push('"' + f.q + '"');
    if (f.status !== 'all' && S.tab === 'transactions') parts.push('status ' + f.status);
    return parts.length ? ' Filtered by: ' + esc(parts.join(', ')) + '. Press CLEAR FILTERS to see everything.' : '';
  }
  function liveNote() {
    var f = filters();
    var live = S.tab === 'health' || S.tab === 'players' || f.to >= todayL();
    $('liveNote').innerHTML = S.tab === 'activity' ? '' : live ? '<b>Live</b> · refreshes every 30 s' : 'Historical window';

  }

    if (!allowed.some(function (t) { return t.id === S.tab; })) S.tab = allowed.length ? allowed[0].id : null;
    $('tabs').innerHTML = allowed.map(function (t) { return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (t.id === S.tab) + '">' + esc(t.label) + '<span class="badge" id="b_' + t.id + '" hidden></span></button>'; }).join('');
    $('tabs').querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.page = 0; saveFilters(); renderTabs(); load(); }; });
    var showF = S.tab && S.tab !== 'health' && S.tab !== 'activity';

    document.querySelectorAll('#filters [data-for]').forEach(function (el) { el.hidden = el.getAttribute('data-for').split(' ').indexOf(S.tab) < 0; });

  }
  function badge(tab, n) { var b = $('b_' + tab); if (!b) return; b.hidden = !n; b.textContent = n > 999 ? '999+' : n; }

  // ------------------------------------------------------------- tables --
  // cols: [{ k, label, n (numeric), fmt(row) -> html, sum: true|fn }]
  function table(id, cols, rows, opts) {
    opts = opts || {};
    var st = S.sort[id] || opts.sort || null;
    var sorted = rows.slice();
    if (st) {
      var c = cols.find(function (x) { return x.k === st.k; });
      var val = c && c.sortVal ? c.sortVal : function (r) { return r[st.k]; };
      sorted.sort(function (a, b) { var x = val(a), y = val(b); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * (st.dir === 'asc' ? 1 : -1); });
    }
    var per = opts.perPage || 0, page = opts.paged ? S.page : 0;
    var shown = per ? sorted.slice(page * per, page * per + per) : sorted;
    var head = '<tr>' + cols.map(function (c) { var on = st && st.k === c.k; return '<th class="' + (c.n ? 'n ' : '') + (c.nosort ? '' : 'sort') + '" data-k="' + c.k + '">' + esc(c.label) + (on ? ' <span class="ar">' + (st.dir === 'asc' ? '▲' : '▼') + '</span>' : '') + '</th>'; }).join('') + '</tr>';
    var tot = opts.totals ? '<tr class="totals">' + cols.map(function (c, i) { var v = opts.totals(c, rows); return '<td class="' + (c.n ? 'n' : '') + '">' + (v == null ? (i === 0 ? 'TOTALS' : '') : v) + '</td>'; }).join('') + '</tr>' : '';
    var body = shown.length ? shown.map(function (r, i) { return '<tr' + (opts.onRow ? ' class="click" data-i="' + (page * per + i) + '"' : '') + '>' + cols.map(function (c) { return '<td class="' + (c.n ? 'n' : '') + '">' + (c.fmt ? c.fmt(r) : esc(r[c.k])) + '</td>'; }).join('') + '</tr>'; }).join('')
      : '<tr><td class="empty" colspan="' + cols.length + '">' + esc(opts.empty || 'Nothing in this window.') + filteredBy() + '</td></tr>';
    var pager = per && sorted.length > per ? '<div class="pager"><span>' + (page * per + 1) + '–' + Math.min(sorted.length, page * per + per) + ' of ' + int(sorted.length) + '</span><a data-pg="-1"' + (page ? '' : ' hidden') + '>Previous</a><a data-pg="1"' + ((page + 1) * per < sorted.length ? '' : ' hidden') + '>Next</a></div>' : '';
    var html = '<div class="wrap"><table id="t_' + id + '"><thead>' + head + '</thead><tbody>' + tot + body + '</tbody></table></div>' + pager;
    setTimeout(function () {
      var t = $('t_' + id); if (!t) return;
      t.querySelectorAll('th.sort').forEach(function (th) { th.onclick = function () { var k = th.getAttribute('data-k'); var cur = S.sort[id] || opts.sort; S.sort[id] = { k: k, dir: cur && cur.k === k && cur.dir === 'desc' ? 'asc' : 'desc' }; S.page = 0; draw(); }; });
      if (opts.onRow) t.querySelectorAll('tbody tr.click').forEach(function (tr) { tr.onclick = function () { opts.onRow(sorted[Number(tr.getAttribute('data-i'))]); }; });
      var w = t.closest('.wrap'); if (w && w.nextElementSibling && w.nextElementSibling.classList.contains('pager')) w.nextElementSibling.querySelectorAll('a[data-pg]').forEach(function (a) { a.onclick = function () { S.page += Number(a.getAttribute('data-pg')); draw(); }; });
    }, 0);
    return html;
  }
  function sum(rows, k) { return rows.reduce(function (s, r) { return s + (Number(r[k]) || 0); }, 0); }
  function numTotals(map) { return function (c, rows) { if (map && map[c.k]) return map[c.k](rows); return c.sum ? (c.fmtSum ? c.fmtSum(sum(rows, c.k)) : int(sum(rows, c.k))) : null; }; }

  // --------------------------------------------------------------- charts --
  function lineChart(points, o) {
    o = o || {};
    var W = 640, H = 210, L = 52, R = 14, T = 12, B = 30;
    if (!points.length) return '<p class="empty">Nothing in this window.</p>';
    var ys = points.map(function (p) { return p.y; }).concat(o.target != null ? [o.target] : []);
    var lo = Math.min(0, Math.min.apply(null, ys)), hi = Math.max.apply(null, ys); if (hi === lo) hi = lo + 1;
    hi += (hi - lo) * 0.08;
    var X = function (i) { return L + (points.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (points.length - 1)); };
    var Y = function (v) { return T + (H - T - B) * (1 - (v - lo) / (hi - lo)); };
    var ticks = 4, grid = '';
    for (var t = 0; t <= ticks; t++) { var v = lo + (hi - lo) * t / ticks; grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="#ececec"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="11" fill="#9a9a9a">' + esc(o.yfmt ? o.yfmt(v) : int(v)) + '</text>'; }
    var path = points.map(function (p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
    var area = path + ' L' + X(points.length - 1).toFixed(1) + ' ' + Y(lo).toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + Y(lo).toFixed(1) + ' Z';
    var step = Math.max(1, Math.ceil(points.length / 8)), xl = '';
    points.forEach(function (p, i) { if (i % step === 0 || i === points.length - 1) xl += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#9a9a9a">' + esc(p.x) + '</text>'; });
    var dots = points.map(function (p, i) { return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (i === points.length - 1 ? 4 : 2.5) + '" fill="' + (o.color || '#2b8fdd') + '"><title>' + esc(p.x + ': ' + (o.yfmt ? o.yfmt(p.y) : int(p.y))) + '</title></circle>'; }).join('');
    var tgt = o.target != null ? '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(o.target).toFixed(1) + '" y2="' + Y(o.target).toFixed(1) + '" stroke="#1a9f8f" stroke-dasharray="5 4"/><text x="' + (W - R) + '" y="' + (Y(o.target) - 5).toFixed(1) + '" text-anchor="end" font-size="11" fill="#1a9f8f">' + esc(o.targetLabel || '') + '</text>' : '';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'chart') + '">' + grid + '<path d="' + area + '" fill="' + (o.color || '#2b8fdd') + '" fill-opacity=".10"/><path d="' + path + '" fill="none" stroke="' + (o.color || '#2b8fdd') + '" stroke-width="2"/>' + tgt + dots + xl + '</svg>';
  }

      if (document.visibilityState !== 'visible' || !S.me || $('playerDlg').open || $('usersDlg').open || $('formDlg').open) return;
      if (S.tab === 'activity') return;
      if (liveNote()) load();
    }, 30000);
  }
  function boot() {
    api('me').then(function (me) {
      S.me = me; $('acctBtn').hidden = false;
      restoreFilters(); renderTabs(); load(); poll();
    }).catch(function (e) { if (e.message !== 'signed_out') { $('view').innerHTML = '<p class="empty">Could not reach the server: ' + esc(e.message) + '</p>'; } });
  }
  var saved = store.get('bc-ops-auth');
  if (saved && saved.token) { S.token = saved.token; boot(); } else openLogin();
})();
</script>
</body>
</html>
